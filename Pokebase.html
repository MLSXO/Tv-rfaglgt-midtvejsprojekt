<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokebase</title>
    <link rel="stylesheet" href="poke.css">
</head>

<body>

<!-- HEADER -->
<header>
    <div class="container header-content">

        <div class="header-title">
            <a href="Pokebase.html">
                <img src="pokebase-logo.png"
                     alt="Pokebase"
                     class="logo">
            </a>
        </div>

        <nav>
            <a href="Dashboard.html">Dashboard</a>
            <a href="Trainer.html">Trainer overview</a>
        </nav>

    </div>
</header>


<main class="container">

    <section class="pokemon-section">

        <h1>Explore Pokémon</h1>

        <p>
            Welcome to Pokebase!
            Explore Pokémon and discover their unique stats.
        </p>

        <!-- FILTERS -->
        <div class="pokemon-filters">

            <input
                    type="text"
                    id="searchName"
                    placeholder="Search Pokémon by name"
            >

            <select id="pokemonType">
                <option value="">All types</option>
                <option value="Normal">Normal</option>
                <option value="Fire">Fire</option>
                <option value="Water">Water</option>
                <option value="Grass">Grass</option>
                <option value="Electric">Electric</option>
                <option value="Ice">Ice</option>
                <option value="Fighting">Fighting</option>
                <option value="Poison">Poison</option>
                <option value="Ground">Ground</option>
                <option value="Flying">Flying</option>
                <option value="Psychic">Psychic</option>
                <option value="Bug">Bug</option>
                <option value="Rock">Rock</option>
                <option value="Ghost">Ghost</option>
                <option value="Dragon">Dragon</option>
            </select>

            <input
                    type="number"
                    id="minAttack"
                    placeholder="Minimum Attack"
                    min="0"
            >

            <button id="searchButton">Search</button>

            <button id="resetButton">Reset</button>

        </div>

        <!-- POKEMON LIST -->
        <div id="pokemon-list"></div>

    </section>

</main>


<!-- FOOTER -->
<footer id="info">

    <div class="container">

        <h2>Group/creators info</h2>

        <div class="group">
            <ul>
                <li>Marcus Larn Sperling</li>
                <li>Emil Frost</li>
                <li>Nikolaj Falck Gutfeld</li>
                <li>John</li>
            </ul>
        </div>

    </div>

</footer>


<!-- JAVASCRIPT -->
<script src="Pokebase.js"></script>

</body>
</html>
